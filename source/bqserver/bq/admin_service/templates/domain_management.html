<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xml:lang="en" lang="en"
      xmlns:py="http://genshi.edgewall.org/"
      xmlns:xi="http://www.w3.org/2001/XInclude">

<xi:include href="master.html" />

<head>
  <title>Domain Management - BisQue Admin</title>
  
  <!-- Fix for templates that do not create html in the body -->
  <style type="text/css">
    #content { margin: 0px; }
    body { background-color: #FAFAFA !important; }
    .domain-management { padding: 20px; }
    .card { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .card-header { background-color: #f8f9fa; padding: 15px; border-bottom: 1px solid #ddd; }
    .card-body { padding: 15px; }
    .form-label { font-weight: bold; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-outline-primary { background-color: transparent; color: #007bff; border: 1px solid #007bff; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 8px; border: 1px solid #ddd; }
    .table th { background-color: #f8f9fa; }
    .row { display: flex; }
    .col-md-6 { flex: 0 0 50%; max-width: 50%; padding: 0 15px; }
    .form-control { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .mb-3 { margin-bottom: 1rem; }
  </style>

  <script type="text/javascript" id="config">
      BQ.Server.toolbar_opts = { 'browse': false };
  </script>
</head>

<body>
  <div class="domain-management">
    <h1>Domain Management</h1>
    
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h3>Add Authorized Domain</h3>
          </div>
          <div class="card-body">
            <form id="domainForm">
              <div class="mb-3">
                <label for="domain" class="form-label">Domain (e.g., university.edu):</label>
                <input type="text" class="form-control" id="domain" name="domain" placeholder="example.edu" />
              </div>
              <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <input type="text" class="form-control" id="description" name="description" placeholder="Description of the domain" />
              </div>
              <button type="button" class="btn btn-primary" onclick="addDomain()">Add Domain</button>
            </form>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h3>Quick Actions</h3>
          </div>
          <div class="card-body">
            <a href="/admin/pending_registrations" class="btn btn-secondary">Manage User Approvals</a>
            <a href="/admin/" class="btn btn-outline-primary">Back to Admin</a>
            <button type="button" class="btn btn-primary" onclick="refreshDomainList()">Refresh List</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-header">
        <h3>Authorized Domains</h3>
      </div>
      <div class="card-body">
        <table id="domainTable" class="table table-striped">
          <thead>
            <tr>
              <th>Domain</th>
              <th>Description</th>
              <th>Created Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="domainTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script type="text/javascript">
    //<![CDATA[
    
    var domainDataTable = null;

    // Initialize on page load
    $(document).ready(function() {
      loadDomains();
    });

    function loadDomains() {
      fetch('/admin/domains_list')
        .then(response => response.json())
        .then(data => {
          if (data.status === 'success') {
            updateDomainTable(data.domains);
          } else {
            alert('Error loading domains: ' + (data.message || 'Unknown error'));
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Failed to load domains');
        });
    }

    function updateDomainTable(domains) {
      // Destroy existing DataTable if it exists
      if (domainDataTable) {
        domainDataTable.destroy();
      }
      
      // Clear existing data
      $('#domainTableBody').empty();
      
      var tableData = [];
      for (var i = 0; i < domains.length; i++) {
        var domain = domains[i];
        var deleteBtn = '<button class="btn btn-danger" onclick="deleteDomain(' + domain.id + ')">Delete</button>';
        
        tableData.push([
          domain.domain || '',
          domain.description || '',
          domain.created_date ? new Date(domain.created_date).toLocaleDateString() : '',
          deleteBtn
        ]);
      }
      
      // Initialize DataTable
      domainDataTable = $('#domainTable').DataTable({
        data: tableData,
        columns: [
          { title: 'Domain' },
          { title: 'Description' },
          { title: 'Created Date' },
          { title: 'Actions', orderable: false }
        ],
        responsive: true,
        pageLength: 10,
        language: {
          emptyTable: 'No domains configured'
        }
      });
    }

    function addDomain() {
      var domainField = document.getElementById('domain');
      var descriptionField = document.getElementById('description');
      
      if (!domainField || !domainField.value.trim()) {
        alert('Please enter a domain');
        return;
      }
      
      var formData = new FormData();
      formData.append('domain', domainField.value.trim());
      formData.append('description', descriptionField ? descriptionField.value.trim() : '');
      
      fetch('/admin/domain_add', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          alert(data.message);
          domainField.value = '';
          if (descriptionField) descriptionField.value = '';
          loadDomains(); // Refresh the list
        } else {
          alert('Error: ' + (data.message || 'Unknown error'));
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Failed to add domain');
      });
    }

    function deleteDomain(domainId) {
      if (!confirm('Are you sure you want to delete this domain?')) {
        return;
      }
      
      var formData = new FormData();
      formData.append('id', domainId);
      
      fetch('/admin/domain_delete/' + domainId, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          alert(data.message);
          loadDomains(); // Refresh the list
        } else {
          alert('Error: ' + (data.message || 'Unknown error'));
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Failed to delete domain');
      });
    }

    function refreshDomainList() {
      loadDomains();
    }

    //]]>
  </script>
</body>
</html>
